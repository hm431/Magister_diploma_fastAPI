version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: diploma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      TZ: Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d diploma"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: